name: Deploy

on:
  push:
    branches: [stage, main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore, build, and test
        run: |
          dotnet restore FlowBridge.slnx --locked-mode
          dotnet build FlowBridge.slnx --configuration Release --no-restore
          dotnet test FlowBridge.slnx --configuration Release --no-build --no-restore
      - name: Create verified static release
        shell: pwsh
        run: |
          ./scripts/Publish-Static.ps1
          ./scripts/Test-StaticSite.ps1 -SiteDirectory dist
      - name: Publish branch to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name flowbridge-systems --branch ${{ github.ref_name }}
